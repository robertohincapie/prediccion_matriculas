[project]
name = "prediccion-matriculas"
version = "0.1.0"
description = "Laboratorio incremental de MLOps para predicción de matrículas universitarias"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openpyxl>=3.1.5",
    "requests>=2.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matriculas"]
